name: Bug report
description: Report a reproducible issue or unexpected behavior
title: "[Bug]: "
labels:
  - bug

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a minimal reproduction if possible
      placeholder: |
        ```typescript
        import { mattr } from "@stinobe/mattr"
        ```
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0

  - type: input
    id: runtime
    attributes:
      label: Runtime
      placeholder: Node.js 22 / Bun 1.x
